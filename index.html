  <button id="admin-nav-btn" onclick="setScreen('admin')" style="display:none;align-items:center;gap:5px;background:transparent;border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--primary-dark);font-size:12px;font-weight:600;padding:5px 11px;cursor:pointer;font-family:inherit;transition:.15s" onmouseover="this.style.background='var(--primary-light)'" onmouseout="this.style.background='transparent'"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Admin</button>
</div>


<!-- Main -->

<!-- Main Layout -->
<div class="layout" id="main-layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-agent-area">
      <div class="sb-label">Selecione o agente</div>
      <div class="agent-pills" id="agent-pills"></div>
    </div>
    <div class="sb-list" id="sb-list">
      <div style="color:rgba(255,255,255,.3);font-size:12px;padding:16px 8px;text-align:center">
        Selecione um agente
      </div>
    </div>
  </aside>

  <!-- Content -->
  <div class="main-area" id="main-area">
    <div id="screen-password" style="position:fixed;inset:0;z-index:9999;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
      <div style="text-align:center;margin-bottom:8px">
        <img src="logo-enotas.jpg" alt="eNotas" style="height:48px;width:auto;object-fit:contain;margin-bottom:18px"/>
        <div style="font-family:'Nunito',sans-serif;font-size:22px;font-weight:700;color:var(--primary)">Gestão de Conhecimento — eNotas</div>
        <div style="font-size:13px;color:var(--text2);margin-top:4px">Digite a senha para continuar</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;width:280px">
        <input id="pwd-input" type="password" placeholder="Senha de acesso" autocomplete="current-password"
          style="padding:10px 14px;border:1.5px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;outline:none;width:100%;box-sizing:border-box"
          onkeydown="if(event.key==='Enter')checkPwd()"/>
        <button onclick="checkPwd()" style="padding:10px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">Entrar</button>
        <div id="pwd-err" style="color:var(--red);font-size:12px;text-align:center;display:none">Senha incorreta. Tente novamente.</div>
      </div>
    </div>
    <div class="loading-wrap" id="screen-loading" style="display:none">
      <div class="spinner"></div>
      <span>Carregando análises...</span>
    </div>
    <div id="screen-home" style="display:none"></div>
    <div id="screen-analyze" style="display:none"></div>
    <div id="screen-export" style="display:none"></div>
  <div id="screen-calibration" style="display:none;flex:1;overflow:hidden"></div>
  <div id="screen-wbs" style="display:none"></div>
  <div id="screen-admin" style="display:none;flex:1;overflow-y:auto;background:var(--bg);padding:20px 24px;flex-direction:column;gap:16px"></div>
  </div>




</div>

<!-- Calibration Layout -->
<div id="cal-layout" style="display:none;flex:1;overflow:hidden;min-height:0">
  <!-- Cal Sidebar -->
  <div class="cal-sb" id="cal-sb">
    <div class="cal-sb-head">Calibragem</div>
    <div id="cal-sb-content" style="flex:1;overflow-y:auto;padding:6px"></div>
  </div>
  <!-- Cal Main -->
  <div class="cal-main" id="cal-main">
    <div id="cal-form-area" style="flex:1"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- XLSX Export Modal -->
<div id="xlsx-modal" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.45);align-items:center;justify-content:center">
  <div style="background:var(--surface);border-radius:var(--radius);box-shadow:0 8px 32px rgba(0,0,0,.18);padding:24px;min-width:320px;max-width:440px;width:90%">
    <div style="font-family:Nunito,sans-serif;font-size:16px;font-weight:700;color:var(--primary);margin-bottom:16px">Exportar XLSX</div>

    <div style="margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Período</div>
      <div id="xlsx-period-opts" style="display:flex;flex-wrap:wrap;gap:6px"></div>
    </div>

    <div style="margin-bottom:20px">
      <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Avaliador</div>
      <div id="xlsx-agent-opts" style="display:flex;flex-wrap:wrap;gap:6px"></div>
    </div>

    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button onclick="document.getElementById('xlsx-modal').style.display='none'" class="btn btn-outline">Cancelar</button>
      <button onclick="confirmDownloadXLSX()" class="btn btn-teal">Baixar</button>
    </div>
  </div>
</div>






<script src="app.js" defer></script>
</body>
